# Assemble le site de révision de Benjamin à partir :
#  - du code des exercices, qui vit dans le dépôt de Maayane (Bensarfat/hebreu-avec-mayane, source/exercices/app.html) ;
#  - des données de Benjamin, ici : donnees.js (vocabulaire, grammaire, conjugaison) et passe-futur.html (onglet « Passé & futur »).
# Toutes les heures, à chaque modification des données, et à la demande (onglet Actions › « Assembler le site » › Run workflow).
#
# Sécurité : l'assemblage (qui exécute le code du dépôt de Maayane) tourne SANS droit d'écriture ;
# seule l'étape « Publier » peut écrire, et elle ne fait que déposer le fichier produit (index.html).
name: Assembler le site

on:
  schedule:
    - cron: "37 * * * *"
  push:
    branches: [main]
    paths:
      - donnees.js
      - passe-futur.html
  workflow_dispatch:

concurrency:
  group: assembler
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Bensarfat/hebreu-avec-mayane
          path: maayane
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Assembler
        run: node maayane/source/exercices/assemble.js --donnees donnees.js --passe-futur passe-futur.html --sortie /tmp/index.html

      - name: Comparer avec la version en ligne
        id: check
        run: |
          if cmp -s /tmp/index.html index.html; then
            echo "Rien de nouveau."
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Transmettre le résultat
        if: steps.check.outputs.changed == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: /tmp/index.html
          retention-days: 3

  publish:
    needs: build
    if: needs.build.outputs.changed == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: /tmp/site

      - name: Publier
        run: |
          cp /tmp/site/index.html index.html
          git config user.name "Benjamin Sarfati"
          git config user.email "contact@docteursarfati.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Assemblage automatique : exercices de Maayane + données de Benjamin"
          git push
